[app]
Hotkey=Ctrl+Shift+Space
MaxResults=20
DebounceMs=90

[browser.chrome]
Name=Google Chrome
Prefix=g
Engine=chromium
Enabled=true
IconPath=
ExecutableCandidates=%ProgramFiles%\Google\Chrome\Application\chrome.exe|%ProgramFiles(x86)%\Google\Chrome\Application\chrome.exe|%LocalAppData%\Google\Chrome\Application\chrome.exe
UserDataCandidates=%LocalAppData%\Google\Chrome\User Data
SearchUrlTemplate=https://www.google.com/search?q={query}
HistoryRelativePath=History
ProfileArgument=--profile-directory={profile}
EnabledProfiles=*

[browser.edge]
Name=Microsoft Edge
Prefix=e
Engine=chromium
Enabled=true
IconPath=
ExecutableCandidates=%ProgramFiles(x86)%\Microsoft\Edge\Application\msedge.exe|%ProgramFiles%\Microsoft\Edge\Application\msedge.exe
UserDataCandidates=%LocalAppData%\Microsoft\Edge\User Data
SearchUrlTemplate=https://www.bing.com/search?q={query}
HistoryRelativePath=History
ProfileArgument=--profile-directory={profile}
EnabledProfiles=*

